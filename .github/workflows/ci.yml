name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate (no DB needed)
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint src/ prisma/ --max-warnings 10

      - name: Production build (SQLite file URL satisfies schema load; no live DB touched)
        env:
          DATABASE_URL: file:./ci.db
          JWT_SECRET: ci-dummy-secret-min-32-chars-long
        run: bun run build
